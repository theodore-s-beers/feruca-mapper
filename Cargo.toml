[package]
name = "feruca-mapper"
version = "0.1.0"
edition = "2024"

[dependencies]
feruca = { git = "https://github.com/theodore-s-beers/feruca" }
postcard = { version = "1.1.3", features = ["alloc"] }
regex = "1.13.1"
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
unicode-canonical-combining-class = "1.0.0"
